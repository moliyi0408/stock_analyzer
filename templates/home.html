<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>股票觀察清單</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/dashboard.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4">
    <h1 class="mb-3">我的股票</h1>
    <p class="text-secondary">像 Watchlist 一樣先看分數、星等與目前建議，再點進詳細分析。</p>
    <div class="row g-3">
      {% for c in cards %}
      <div class="col-12 col-md-6 col-xl-4">
        <a class="card stock-card text-decoration-none" href="/stocks/{{ c.stock_id }}">
          <div class="card-body">
            <div class="d-flex justify-content-between">
              <h2>{{ c.stock_id }}</h2>
              <span class="stars">{{ c.stars }}</span>
            </div>
            <div class="display-6">{{ c.price or 'N/A' }}</div>
            <div class="mt-2 badge rounded-pill text-bg-warning">{{ c.advice }}</div>
            <div class="score mt-3">{{ c.score or 'N/A' }} 分</div>
          </div>
        </a>
      </div>
      {% endfor %}
    </div>
  </main>
</body>
</html>
